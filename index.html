<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111">
<title>DeleteMe — iPhone</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111;
               overscroll-behavior: none; touch-action: none;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  /* vídeo fica "invisível" embaixo do canvas (o iOS exige que esteja tocando) */
  #video { position: fixed; inset: 0; width: 100%; height: 100%;
           object-fit: cover; opacity: 0.01; }
  #tela  { position: fixed; inset: 0; width: 100%; height: 100%;
           object-fit: cover; background: #111; }

  #status { position: fixed; top: calc(env(safe-area-inset-top) + 12px); left: 50%;
            transform: translateX(-50%); max-width: 92vw; padding: 10px 16px;
            border-radius: 999px; background: rgba(0,0,0,.55); color: #fff;
            font-size: 13px; line-height: 1.45; text-align: center; }
  #status.erro { background: rgba(200,40,40,.8); }

  #punho { position: fixed; top: calc(env(safe-area-inset-top) + 58px); left: 50%;
           transform: translateX(-50%); padding: 8px 18px; border-radius: 999px;
           background: rgba(255,80,80,.85); color: #fff; font-weight: 700;
           font-size: 14px; letter-spacing: .4px; }

  #contador { position: fixed; inset: 0; display: flex; align-items: center;
              justify-content: center; font-size: 160px; font-weight: 800;
              color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,.6); pointer-events: none; }

  #acoes { position: fixed; left: 0; right: 0;
           bottom: calc(env(safe-area-inset-bottom) + 14px);
           display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
           padding: 0 12px; }
  .btn { padding: 15px 18px; border-radius: 16px; background: rgba(255,255,255,.16);
         color: #fff; font-size: 13px; font-weight: 700; letter-spacing: .4px;
         border: 1.5px solid rgba(255,255,255,.35); cursor: pointer;
         backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
         text-align: center; min-width: 44vw; }
  .btn:active { transform: scale(.96); background: rgba(255,255,255,.32); }
  .btn.destaque { background: rgba(60,200,90,.55); border-color: rgba(120,255,160,.8); }
  .btn.ligado  { background: rgba(220,60,60,.55); border-color: rgba(255,140,140,.8); }
  .btn[disabled] { opacity: .45; }

  .oculto { display: none !important; }
</style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="tela"></canvas>

  <div id="status">Toque no botão verde para começar.</div>
  <div id="punho" class="oculto">✊ punho detectado</div>
  <div id="contador" class="oculto">5</div>

  <div id="acoes">
    <div class="btn destaque" id="btnCamera">📷 PERMITIR CÂMERA E COMEÇAR</div>
    <div class="btn" id="btnFundo">CAPTURAR FUNDO (5s)</div>
    <div class="btn" id="btnEfeito">LIGAR EFEITO</div>
    <div class="btn" id="btnBbox">CAIXA DA PESSOA: ON</div>
  </div>

  <canvas id="fundo" class="oculto"></canvas>

  <script>
'use strict';

/* ============================================================
   Lógica pura (a mesma de logica.mjs — espelhada aqui para o
   app ser um arquivo único, sem imports que possam falhar)
   ============================================================ */
function DebounceTempo(ms) {
  this.ms = ms;
  this.state = false;
  this.desde = null;
}
DebounceTempo.prototype.update = function (state, agoraMs) {
  if (state === this.state) {
    this.desde = null;
    return this.state;
  }
  if (this.desde === null) this.desde = agoraMs;
  if (agoraMs - this.desde >= this.ms) {
    this.state = state;
    this.desde = null;
  }
  return this.state;
};

function distancia(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}
function contarDedosEstendidos(landmarks) {
  const pulso = landmarks[0];
  const pares = [[8, 6], [12, 10], [16, 14], [20, 18]];
  let n = 0;
  for (const par of pares) {
    if (distancia(landmarks[par[0]], pulso) > distancia(landmarks[par[1]], pulso)) n++;
  }
  return n;
}
function classificarMao(landmarks) {
  if (!landmarks || landmarks.length === 0) return null;
  return contarDedosEstendidos(landmarks) < 3;
}
function maiorBBoxPessoa(detections, largura, altura, padding) {
  padding = (padding === undefined) ? 10 : padding;
  let area = 0, bbox = null;
  for (const d of detections) {
    const b = d.boundingBox;
    if (!b) continue;
    if (b.width * b.height > area) {
      area = b.width * b.height;
      const x = Math.max(0, Math.trunc(b.originX) - padding);
      const y = Math.max(0, Math.trunc(b.originY) - padding);
      const w = Math.min(largura - x, Math.trunc(b.width) + padding * 2);
      const h = altura - y;
      bbox = { x: x, y: y, w: w, h: h };
    }
  }
  return bbox;
}

/* ============================================================
   Estado e elementos
   ============================================================ */
const video = document.getElementById('video');
const tela = document.getElementById('tela');
const ctx = tela.getContext('2d');
const fundoCv = document.getElementById('fundo');
const fundoCtx = fundoCv.getContext('2d');
const elStatus = document.getElementById('status');
const elPunho = document.getElementById('punho');
const elContador = document.getElementById('contador');
const btnCamera = document.getElementById('btnCamera');
const btnFundo = document.getElementById('btnFundo');
const btnEfeito = document.getElementById('btnEfeito');
const btnBbox = document.getElementById('btnBbox');

function status(t, erro) {
  elStatus.textContent = t;
  elStatus.classList.toggle('erro', !!erro);
}

const estado = new DebounceTempo(200);      // 200 ms de debounce, baseado em tempo
let mp = null, detector = null, mao = null;
let stream = null, modo = 'user';           // 'user' = frontal · 'environment' = traseira
let fundoOk = false, efeito = false, mostrarCaixa = true, capturando = false;
let modelosProntos = false, carregandoModelos = false;

// cadência das análises de IA — a câmera continua lisa entre elas
const INTERVALO_MAO = 60;                   // ~15 Hz — suficiente para o punho
const INTERVALO_PESSOA = 200;               // ~5 Hz — a caixa da pessoa muda devagar
let ultimaMaoT = -1e9, ultimaPessoaT = -1e9;
let fechadaAtual = null, ultimoBBox = null;

const forcadoCdn = location.search.indexOf('cdn') >= 0;
const forcadoCpu = location.search.indexOf('cpu') >= 0;
const forcadoGpu = location.search.indexOf('gpu') >= 0;
// no celular o WASM SIMD (CPU) costuma ser mais rápido que o delegado GPU do Safari
const ehCelular = /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent);
const tentarGpu = forcadoGpu || (!forcadoCpu && !ehCelular);

// quadro reduzido para os modelos (a caixa é redimensionada de volta)
const DET_W = 320;
const detCv = document.createElement('canvas');
const detCtx = detCv.getContext('2d');

/* ============================================================
   Endereços: primeiro os arquivos locais; se faltarem, CDN
   ============================================================ */
const CDN_WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm';
const CDN_BUNDLE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs';
const MODELOS = {
  det: {
    local: './models/efficientdet_lite0.tflite',
    cdn: 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite'
  },
  mao: {
    local: './models/hand_landmarker.task',
    cdn: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
  }
};

async function existe(url) {
  try {
    const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
    return r.ok;
  } catch (e) { return false; }
}

async function baixarBuffer(url, aoProgresso) {
  const resp = await fetch(url, { cache: 'force-cache' });
  if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ao baixar ' + url);
  const total = Number(resp.headers.get('Content-Length')) || 0;
  const reader = resp.body.getReader();
  const partes = [];
  let lidos = 0;
  for (;;) {
    const r = await reader.read();
    if (r.done) break;
    partes.push(r.value);
    lidos += r.value.length;
    if (aoProgresso) aoProgresso(lidos, total);
  }
  const buf = new Uint8Array(lidos);
  let off = 0;
  for (const p of partes) { buf.set(p, off); off += p.length; }
  return buf;
}

function comTimeout(promessa, ms, oQue) {
  return Promise.race([
    promessa,
    new Promise((_, rejeita) => setTimeout(() => rejeita(new Error('tempo esgotado: ' + oQue)), ms))
  ]);
}

/* ============================================================
   Carregamento da biblioteca + modelos (com diagnóstico)
   ============================================================ */
async function criarModelo(criar, fileset, opcoes) {
  if (tentarGpu) {
    try {
      return await comTimeout(criar.createFromOptions(fileset, Object.assign({}, opcoes,
        { baseOptions: Object.assign({}, opcoes.baseOptions, { delegate: 'GPU' }) })),
        10000, 'GPU');
    } catch (e) {
      console.warn('GPU não rolou, usando CPU:', e);
    }
  }
  return await comTimeout(criar.createFromOptions(fileset, opcoes), 60000, 'CPU');
}

async function carregarModelos() {
  if (carregandoModelos || modelosProntos) return;
  carregandoModelos = true;
  try {
    // --- biblioteca de visão (local ou CDN) ---
    const localOk = !forcadoCdn && (await existe('./tasks-vision/vision_wasm_internal.js'));
    const origemWasm = localOk ? './tasks-vision' : CDN_WASM;

    status('Carregando biblioteca de visão (' + (localOk ? 'local' : 'online') + ')…');
    if (localOk) {
      mp = await import('./tasks-vision/vision_bundle.mjs');
    } else {
      mp = await import(CDN_BUNDLE);
    }
    const fileset = await mp.FilesetResolver.forVisionTasks(origemWasm);

    // --- modelos (local ou CDN, com progresso) ---
    async function pegarModelo(ref, nome) {
      const usarLocal = !forcadoCdn && (await existe(ref.local));
      const url = usarLocal ? ref.local : ref.cdn;
      return {
        buffer: await baixarBuffer(url, (lidos, total) => {
          const pct = total ? Math.round(lidos / total * 100) + '%' : (lidos / 1048576).toFixed(1) + 'MB';
          status('Baixando ' + nome + '… ' + pct + (usarLocal ? '' : ' (online)'));
        }),
        fonte: usarLocal ? 'local' : 'online'
      };
    }

    const a = await pegarModelo(MODELOS.det, 'detector de pessoas');
    const b = await pegarModelo(MODELOS.mao, 'detector de mãos');
    status('Carregando os modelos na memória…');

    detector = await criarModelo(mp.ObjectDetector, fileset, {
      baseOptions: { modelAssetBuffer: a.buffer },
      runningMode: 'VIDEO',
      scoreThreshold: 0.5,
      categoryAllowlist: ['person']
    });
    mao = await criarModelo(mp.HandLandmarker, fileset, {
      baseOptions: { modelAssetBuffer: b.buffer },
      runningMode: 'VIDEO',
      numHands: 1
    });

    modelosProntos = true;
    const origem = (a.fonte === 'local' && b.fonte === 'local') ? 'locais' : 'online';
    status(stream
      ? 'Tudo pronto (' + origem + ')! Feche o punho para se apagar.'
      : 'Tudo pronto (' + origem + ')! Toque no botão verde e permita a câmera.');
  } catch (e) {
    console.error(e);
    status('Erro ao carregar os modelos: ' + (e && e.message ? e.message : e) +
      ' — se você publicou só o HTML, os arquivos models/ e tasks-vision/ podem estar faltando.', true);
  } finally {
    carregandoModelos = false;
  }
}

/* ============================================================
   Câmera (a permissão aparece no primeiro toque do botão)
   ============================================================ */
async function iniciarCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status('Este recurso precisa de HTTPS. Abra pelo link do site, não como arquivo.', true);
    return;
  }
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: modo, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
  } catch (e) {
    const n = e && e.name;
    if (n === 'NotAllowedError' || n === 'SecurityError') {
      status('Você negou a câmera. No Safari: toque em "AA" na barra de endereço → ' +
        'Configurações do site → Câmera → Permitir e recarregue. Depois toque no botão verde.', true);
    } else if (n === 'NotFoundError') {
      status('Nenhuma câmera encontrada neste aparelho.', true);
    } else if (n === 'NotReadableError') {
      status('A câmera está em uso por outro app. Feche-o e tente de novo.', true);
    } else {
      status('Não consegui abrir a câmera: ' + (e && e.message ? e.message : e), true);
    }
    return;
  }
  video.srcObject = stream;
  try { await video.play(); } catch (e) {}
  btnCamera.textContent = '🔄 TROCAR CÂMERA (' + (modo === 'user' ? 'frontal' : 'traseira') + ')';
  status(modelosProntos
    ? 'Câmera ligada! Capture o fundo com a cena vazia.'
    : 'Câmera ligada! Aguarde os modelos…');
  if (navigator.wakeLock) { try { await navigator.wakeLock.request('screen'); } catch (e) {} }
  carregarModelos();          // garante que os modelos continuem carregando
}

/* ============================================================
   Captura do fundo
   ============================================================ */
async function capturarFundo() {
  if (!stream || capturando) {
    if (!stream) status('Toque no botão verde e permita a câmera primeiro.', true);
    return;
  }
  capturando = true;
  btnFundo.disabled = true;
  for (let s = 5; s > 0; s--) {
    elContador.textContent = String(s);
    elContador.classList.remove('oculto');
    status('Saia do quadro! Capturando o fundo em ' + s + 's…');
    await new Promise(r => setTimeout(r, 1000));
  }
  elContador.classList.add('oculto');
  fundoCtx.drawImage(video, 0, 0, fundoCv.width, fundoCv.height);
  fundoOk = true;
  capturando = false;
  btnFundo.disabled = false;
  status('Fundo capturado ✓ Toque em LIGAR EFEITO e feche o punho para se apagar.');
}

/* ============================================================
   Laço principal — desenho todo quadro; IA em cadência própria
   ============================================================ */
function tick() {
  requestAnimationFrame(tick);
  if (!stream || !detector || !mao || video.readyState < 2) return;
  const w = video.videoWidth, h = video.videoHeight;
  if (!w) return;

  if (tela.width !== w) {                 // primeira vez (ou troca de câmera)
    tela.width = w; tela.height = h;
    fundoCv.width = w; fundoCv.height = h;
    detCv.width = DET_W;
    detCv.height = Math.max(1, Math.round(h * DET_W / w));
    if (fundoOk) {
      fundoOk = false;
      status('A câmera mudou: capture o fundo de novo.');
    }
  }

  const t = performance.now();

  // --- mão: a cada 60 ms ---
  if (t - ultimaMaoT >= INTERVALO_MAO) {
    ultimaMaoT = t;
    detCtx.drawImage(video, 0, 0, detCv.width, detCv.height);
    const res = mao.detectForVideo(detCv, t);
    const lista = res.landmarks || res.handLandmarks || [];
    fechadaAtual = classificarMao(lista[0] || null);
  }

  // --- pessoa: só quando precisa (efeito/caixa), e mais devagar sem efeito ---
  const intervaloPessoa = efeito ? INTERVALO_PESSOA : 500;
  if ((efeito || mostrarCaixa) && t - ultimaPessoaT >= intervaloPessoa) {
    ultimaPessoaT = t;
    detCtx.drawImage(video, 0, 0, detCv.width, detCv.height);
    const res = detector.detectForVideo(detCv, t);
    const bb = maiorBBoxPessoa(res.detections || [], detCv.width, detCv.height);
    if (bb) {
      const sx = w / detCv.width, sy = h / detCv.height;
      ultimoBBox = {
        x: Math.round(bb.x * sx), y: Math.round(bb.y * sy),
        w: Math.round(bb.w * sx), h: Math.round(bb.h * sy)
      };
    } else {
      ultimoBBox = null;
    }
  }

  // debounce baseado em tempo (200 ms reais, independente do FPS)
  const ativo = estado.update(fechadaAtual === true, t);
  elPunho.classList.toggle('oculto', fechadaAtual !== true);

  // desenha o quadro da câmera — todo quadro, sem esperar os modelos
  ctx.drawImage(video, 0, 0, w, h);

  // efeito: cola o fundo por cima da pessoa (só com punho fechado, após o debounce)
  const bbox = ultimoBBox;
  if (efeito && ativo && bbox && fundoOk) {
    ctx.drawImage(fundoCv, bbox.x, bbox.y, bbox.w, bbox.h,
                         bbox.x, bbox.y, bbox.w, bbox.h);
  }

  // caixa DEPOIS do efeito (fica visível — no Python ela era pintada antes e sumia)
  if (bbox && mostrarCaixa) {
    ctx.strokeStyle = '#2f2';
    ctx.lineWidth = 3;
    ctx.strokeRect(bbox.x, bbox.y, bbox.w, bbox.h);
  }
}

/* ============================================================
   Botões
   ============================================================ */
btnCamera.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (stream) modo = (modo === 'user') ? 'environment' : 'user';
  iniciarCamera();
});
btnFundo.addEventListener('pointerdown', e => { e.preventDefault(); capturarFundo(); });
btnEfeito.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!modelosProntos) {
    status('Os modelos ainda estão carregando…', true);
    return;
  }
  if (!fundoOk) {
    status('Capture o fundo primeiro (cena sem ninguém).', true);
    return;
  }
  efeito = !efeito;
  btnEfeito.textContent = efeito ? 'DESLIGAR EFEITO' : 'LIGAR EFEITO';
  btnEfeito.classList.toggle('ligado', efeito);
  status(efeito
    ? 'Efeito ligado! Feche o punho para se apagar do vídeo.'
    : 'Efeito desligado.');
});
btnBbox.addEventListener('pointerdown', e => {
  e.preventDefault();
  mostrarCaixa = !mostrarCaixa;
  btnBbox.textContent = 'CAIXA DA PESSOA: ' + (mostrarCaixa ? 'ON' : 'OFF');
});

document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

// carrega os modelos em paralelo — a permissão da câmera espera o botão verde
carregarModelos();
tick();
  </script>
</body>
</html>
