<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilhete ao vivo — Liga das Nações da UEFA</title>
<!-- =====================================================================
     PÁGINA DE PLACAR AO VIVO — arquivo único (HTML + CSS + JS)
     • Mostra exatamente os 7 jogos enviados na conversa (bilhete múltiplo).
     • Busca placares reais na API pública TheSportsDB (não inventa resultados).
     • Atualiza sozinha a cada 30s, sem recarregar a página.
     • Configuração no começo do JavaScript (chave da API, intervalo e jogos).
     ===================================================================== -->
<style>
/* =====================================================================
   TEMA / VARIÁVEIS
   ===================================================================== */
:root{
  --bg:#0a0f16;
  --bg-degrade:#15243a;
  --card:#131c28;
  --card-alto:#18222f;
  --linha:rgba(255,255,255,.07);
  --texto:#eaf1fa;
  --texto2:#9fb0c4;
  --apagado:#6b7f96;
  --verde:#2ee07a;
  --vermelho:#ff4d5e;
  --amarelo:#ffb020;
  --azul:#4cc9ff;
  --raio:16px;
  --sombra:0 8px 26px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;
  background:
    radial-gradient(1100px 500px at 50% -220px, var(--bg-degrade) 0%, rgba(21,36,58,0) 70%),
    var(--bg);
  color:var(--texto);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.4;
}

/* =====================================================================
   TOPO (cabeçalho fixo com resumo, filtros e busca)
   ===================================================================== */
.topo{
  position:sticky; top:0; z-index:30;
  background:rgba(10,15,22,.85);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--linha);
  padding:12px 14px 10px;
}
.topo__linha{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;max-width:1180px;margin:0 auto}
.topo h1{margin:0;font-size:1.05rem;letter-spacing:.2px}
.topo__sub{margin:2px 0 0;font-size:.74rem;color:var(--apagado)}
.topo__acoes{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.saude{width:10px;height:10px;border-radius:50%;background:var(--apagado);display:inline-block;transition:background .3s}
.saude--ok{background:var(--verde);box-shadow:0 0 10px rgba(46,224,122,.7)}
.saude--erro{background:var(--vermelho);box-shadow:0 0 10px rgba(255,77,94,.7)}
.btn{
  appearance:none;border:1px solid var(--linha);background:var(--card-alto);color:var(--texto);
  padding:7px 12px;border-radius:999px;font-size:.76rem;font-weight:600;cursor:pointer;
  transition:transform .15s ease, background .2s ease, border-color .2s;
}
.btn:hover{background:#1f2c3d;border-color:rgba(255,255,255,.16)}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.5;cursor:default}

/* faixa de resumo do bilhete */
.resumo{
  display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;max-width:1180px;margin:0 auto;
  scrollbar-width:none;
}
.resumo::-webkit-scrollbar{display:none}
.resumo__item{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  background:var(--card);border:1px solid var(--linha);border-radius:999px;
  padding:5px 11px;font-size:.72rem;color:var(--texto2);white-space:nowrap;
}
.resumo__item b{color:var(--texto)}

/* filtros + busca */
.controles{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:1180px;margin:8px auto 0}
.filtros{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto}
.filtros::-webkit-scrollbar{display:none}
.filtro{
  appearance:none;cursor:pointer;white-space:nowrap;
  background:transparent;border:1px solid var(--linha);color:var(--texto2);
  padding:6px 13px;border-radius:999px;font-size:.78rem;font-weight:600;
  transition:all .2s ease;
}
.filtro:hover{color:var(--texto);border-color:rgba(255,255,255,.18)}
.filtro.ativo{background:var(--texto);border-color:var(--texto);color:#0a0f16}
.busca{
  flex:1 1 180px;min-width:150px;
  background:var(--card);border:1px solid var(--linha);color:var(--texto);
  padding:8px 12px;border-radius:999px;font-size:.8rem;outline:none;transition:border-color .2s;
}
.busca:focus{border-color:var(--azul)}
.busca::placeholder{color:var(--apagado)}

/* avisos */
.aviso{
  max-width:1180px;margin:10px auto 0;padding:10px 13px;border-radius:12px;font-size:.8rem;
  background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.35);color:#ffd08a;
  animation:surgir .3s ease;
}
.demo{
  max-width:1180px;margin:10px auto 0;padding:10px 13px;border-radius:12px;font-size:.8rem;font-weight:700;
  background:rgba(76,201,255,.12);border:1px solid rgba(76,201,255,.4);color:#9fe0ff;text-align:center;
}
@keyframes surgir{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* =====================================================================
   LISTA DE JOGOS (cards)
   ===================================================================== */
.cards{
  display:grid;gap:14px;padding:14px;max-width:1180px;margin:0 auto;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  align-items:start;
}
.card{
  background:linear-gradient(180deg,var(--card) 0%,#111a25 100%);
  border:1px solid var(--linha);border-radius:var(--raio);
  padding:14px;box-shadow:var(--sombra);
  transition:transform .22s ease, border-color .35s ease, box-shadow .35s ease, opacity .3s ease;
}
@media (hover:hover){ .card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.14)} }
.card--aovivo{border-color:rgba(255,77,94,.38);box-shadow:0 0 0 1px rgba(255,77,94,.10),var(--sombra)}
.card--flash{animation:flashGol 1.4s ease-out 1}
@keyframes flashGol{
  0%{border-color:var(--verde);box-shadow:0 0 0 3px rgba(46,224,122,.35),var(--sombra)}
  100%{border-color:rgba(255,255,255,.07);box-shadow:var(--sombra)}
}

.card__topo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.campeonato{font-size:.68rem;color:var(--apagado);letter-spacing:.03em;text-transform:uppercase;font-weight:600}

/* selos de status */
.chip{
  display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;
  padding:4px 10px;border-radius:999px;border:1px solid transparent;
  font-size:.66rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
}
.chip--aovivo{background:rgba(255,77,94,.14);color:#ff93a0;border-color:rgba(255,77,94,.38)}
.chip--intervalo{background:rgba(255,176,32,.13);color:#ffc75e;border-color:rgba(255,176,32,.38)}
.chip--encerrado{background:rgba(255,255,255,.06);color:var(--texto2);border-color:var(--linha)}
.chip--proximo{background:rgba(76,201,255,.11);color:#93dcff;border-color:rgba(76,201,255,.32)}
.chip--semdados{background:rgba(255,255,255,.05);color:var(--apagado);border-color:var(--linha)}
.chip--adiado{background:rgba(255,255,255,.05);color:var(--apagado);border-color:var(--linha)}
.ponto{
  width:8px;height:8px;border-radius:50%;background:var(--vermelho);display:inline-block;
  animation:pulsar 1.5s infinite;
}
@keyframes pulsar{
  0%{box-shadow:0 0 0 0 rgba(255,77,94,.65)}
  70%{box-shadow:0 0 0 9px rgba(255,77,94,0)}
  100%{box-shadow:0 0 0 0 rgba(255,77,94,0)}
}

/* confronto: time | placar | time */
.confronto{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.time{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.time__nome{
  font-size:.83rem;font-weight:600;text-align:center;line-height:1.15;
  max-width:11ch;overflow-wrap:break-word;
}
.escudo{
  width:44px;height:44px;border-radius:50%;flex:0 0 auto;
  background:#1b2637;border:1px solid rgba(255,255,255,.08);
  display:grid;place-items:center;overflow:hidden;
}
.escudo img{width:100%;height:100%;object-fit:contain;padding:5px}
.iniciais{font-weight:800;font-size:.8rem;color:var(--texto2);letter-spacing:.02em}

.placar{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 4px}
.placar b{
  font-size:clamp(1.9rem,8vw,2.4rem);font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums;min-width:1.4ch;text-align:center;display:inline-block;
}
.placar .x{color:var(--apagado);font-size:.95rem;font-weight:700}
.placar--final b{color:var(--texto2);font-size:clamp(1.5rem,6vw,1.85rem)}
.placar--hora b{font-size:clamp(1.5rem,6vw,1.9rem);color:var(--texto2);font-weight:700}
.placar b.gol{animation:golPulso 1s ease-out 2;color:var(--verde)}
@keyframes golPulso{
  0%{transform:scale(1)}
  25%{transform:scale(1.45);text-shadow:0 0 20px rgba(46,224,122,.9)}
  60%{transform:scale(1.08)}
  100%{transform:scale(1)}
}
.minuto{font-size:.7rem;color:#ff93a0;font-weight:700;text-align:center;margin-top:6px;letter-spacing:.04em}

/* rodapé do card */
.card__rodape{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:12px;padding-top:10px;border-top:1px dashed var(--linha);
  font-size:.71rem;color:var(--apagado);flex-wrap:wrap;
}
.palpite{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.palpite__tag{background:rgba(255,255,255,.05);border:1px solid var(--linha);border-radius:999px;padding:3px 9px}
.situacao{font-weight:800;letter-spacing:.02em}
.situacao--ok{color:var(--verde)}
.situacao--ruim{color:var(--vermelho)}
.situacao--neutro{color:var(--amarelo)}
.inicio{white-space:nowrap}

/* =====================================================================
   RODAPÉ DA PÁGINA
   ===================================================================== */
.rodape{
  max-width:1180px;margin:0 auto;padding:6px 16px 30px;
  display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;
  font-size:.72rem;color:var(--apagado);
}
.rodape b{color:var(--texto2)}
</style>
</head>
<body>

<header class="topo">
  <div class="topo__linha">
    <div>
      <h1>⚽ Bilhete ao vivo</h1>
      <p class="topo__sub">7 jogos • Liga das Nações da UEFA • 02/10/2026</p>
    </div>
    <div class="topo__acoes">
      <span class="saude" id="saude" title="Status da conexão com a API"></span>
      <button class="btn" id="btnAtualizar" title="Atualizar agora">Atualizar</button>
    </div>
  </div>

  <!-- Resumo: contadores de status + cota total do bilhete -->
  <div class="resumo" id="resumo"></div>

  <!-- Filtros e busca -->
  <div class="controles">
    <div class="filtros" role="group" aria-label="Filtrar jogos">
      <button class="filtro ativo" data-filtro="todos">Todos</button>
      <button class="filtro" data-filtro="aoVivo">Ao vivo</button>
      <button class="filtro" data-filtro="encerrados">Encerrados</button>
      <button class="filtro" data-filtro="proximos">Próximos</button>
    </div>
    <input class="busca" id="busca" type="search" placeholder="Buscar time…" autocomplete="off">
  </div>

  <div class="aviso" id="aviso" hidden></div>
  <div class="demo" id="demoBadge" hidden>MODO DEMO ATIVO — placares de exemplo, não são reais</div>
</header>

<main class="cards" id="cards"></main>

<footer class="rodape">
  <span id="ultimaAtualizacao">Aguardando a primeira atualização…</span>
  <span>Fonte: TheSportsDB (API pública) • atualização automática a cada <b id="rodapeIntervalo">30</b>s <span id="proxima"></span></span>
</footer>

<script>
"use strict";

/* =====================================================================
   1) CONFIGURAÇÃO — É AQUI QUE VOCÊ MEXE
   ---------------------------------------------------------------------
   API_KEY        : chave da API do TheSportsDB. "3" é a chave pública de
                    teste (funciona sem cadastro). Para uso pesado, crie
                    sua chave gratuita em thesportsdb.com e cole aqui.
   INTERVALO_SEGUNDOS: de quantos em quantos segundos a página busca os
                    placares (use 20 ou 30).
   MODO_DEMO      : true mostra placares DE EXEMPLO (falsos, só para testar
                    o visual). Fica DESLIGADO por padrão.
   JOGOS          : exatamente os 7 jogos do bilhete. "idEvento" é o ID do
                    jogo no TheSportsDB — para trocar por outro jogo, ache
                    o ID em:
                    https://www.thesportsdb.com/api/v1/json/3/searchevents.php?e=TimeA_vs_TimeB
                    (troque espaços por %20). ex.: e=France%20vs%20Italy
   ===================================================================== */
const CONFIG = {
  API_KEY: "3",
  URL_BASE: "https://www.thesportsdb.com/api/v1/json",
  INTERVALO_SEGUNDOS: 30,       // atualização normal
  INTERVALO_RETRY_SEGUNDOS: 10, // retentativa em caso de falha
  TIMEOUT_MS: 8000,             // desiste de uma requisição travada
  MODO_DEMO: false,             // ⚠️ placares falsos só se virar true
  VALOR_APOSTA: 1.00,           // valor da aposta (para o retorno potencial)

  JOGOS: [
    {
      idEvento: "2442795",
      casa: { nome: "Ilhas Faroe",  escudo: "https://r2.thesportsdb.com/images/media/team/badge/pjs0io1552936544.png" },

      campeonato: "Liga das Nações da UEFA — Liga C",
      inicio: "2026-10-02T15:45:00-03:00",
      palpite: { lado: "fora", nome: "Eslováquia", odd: 1.54 }
    },
    {
      idEvento: "2442790",
      casa: { nome: "Hungria",      escudo: "https://r2.thesportsdb.com/images/media/team/badge/ihaoit1717365719.png" },
      fora: { nome: "Geórgia",      escudo: "https://r2.thesportsdb.com/images/media/team/badge/bhwotj1654205067.png" },
      campeonato: "Liga das Nações da UEFA — Liga B",
      inicio: "2026-10-02T15:45:00-03:00",
      palpite: { lado: "casa", nome: "Hungria", odd: 2.26 }
    },
    {
      idEvento: "2442792",
      casa: { nome: "Polônia",      escudo: "https://r2.thesportsdb.com/images/media/team/badge/ttvrxy1455466076.png" },
      fora: { nome: "Romênia",      escudo: "https://r2.thesportsdb.com/images/media/team/badge/w903wb1689198300.png" },
      campeonato: "Liga das Nações da UEFA — Liga B",
      inicio: "2026-10-02T15:45:00-03:00",
      palpite: { lado: "casa", nome: "Polônia", odd: 1.63 }
    },
    {
      idEvento: "2442793",
      casa: { nome: "Bósnia e Herzegovina", escudo: "https://r2.thesportsdb.com/images/media/team/badge/wtqqst1455463120.png" },
      fora: { nome: "Suécia",       escudo: "https://r2.thesportsdb.com/images/media/team/badge/h5adzg1591981772.png" },
      campeonato: "Liga das Nações da UEFA — Liga B",
      inicio: "2026-10-02T15:45:00-03:00",
      palpite: { lado: "fora", nome: "Suécia", odd: 2.35 }
    },
    {
      idEvento: "2442788",
      casa: { nome: "França",       escudo: "https://r2.thesportsdb.com/images/media/team/badge/ejx5za1788198941.png" },
      fora: { nome: "Itália",       escudo: "https://r2.thesportsdb.com/images/media/team/badge/fxijcp1726167035.png" },
      campeonato: "Liga das Nações da UEFA — Liga A",
      inicio: "2026-10-02T15:45:00-03:00",
      palpite: { lado: "casa", nome: "França", odd: 1.46 }
    },
    {
      idEvento: "2442789",
      casa: { nome: "Bélgica",      escudo: "https://r2.thesportsdb.com/images/media/team/badge/8xlvxv1592062265.png" },
      fora: { nome: "Turquia",      escudo: "https://r2.thesportsdb.com/images/media/team/badge/70c4oo1591982459.png" },
      campeonato: "Liga das Nações da UEFA — Liga A",
      inicio: "2026-10-02T15:45:00-03:00",
      palpite: { lado: "casa", nome: "Bélgica", odd: 1.57 }
    },
    {
      idEvento: "2475296",
      casa: { nome: "Letônia",      escudo: "https://r2.thesportsdb.com/images/media/team/badge/3zoyfk1692679699.png" },
      fora: { nome: "Montenegro",   escudo: "https://r2.thesportsdb.com/images/media/team/badge/dywswx1552859263.png" },
      campeonato: "Liga das Nações da UEFA — Liga C",
      inicio: "2026-10-02T13:00:00-03:00",
      palpite: { lado: "fora", nome: "Montenegro", odd: 1.72 }
    }
  ]
};

/* =====================================================================
   2) STATUS POSSÍVEIS E ORDEM DE EXIBIÇÃO
   ===================================================================== */
const ESTILO_STATUS = {
  aoVivo:      { classe: "chip--aovivo",    rotulo: "Ao vivo" },
  intervalo:   { classe: "chip--intervalo", rotulo: "Intervalo" },
  encerrado:   { classe: "chip--encerrado", rotulo: "Encerrado" },
  naoIniciado: { classe: "chip--proximo",   rotulo: "Não iniciado" },
  semDados:    { classe: "chip--semdados",  rotulo: "Aguardando dados" },
  adiado:      { classe: "chip--adiado",    rotulo: "Adiado" }
};
// Jogos ao vivo sempre primeiro; depois intervalo, próximos, sem dados e encerrados.
const ORDEM_STATUS = { aoVivo: 0, intervalo: 1, naoIniciado: 2, semDados: 3, encerrado: 4, adiado: 5 };
// Grupos usados pelos filtros do topo
const FILTROS = {
  todos:      () => true,
  aoVivo:     (c) => c === "aoVivo" || c === "intervalo",
  encerrados: (c) => c === "encerrado",
  proximos:   (c) => c === "naoIniciado" || c === "semDados" || c === "adiado"
};

/* =====================================================================
   3) UTILIDADES
   ===================================================================== */
const $ = (sel) => document.querySelector(sel);

function semAcento(txt){
  return (txt || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}
function iniciais(nome){
  const partes = semAcento(nome).split(/\s+/).filter(p => p.length > 2);
  const base = partes.length ? partes : semAcento(nome).split(/\s+/);
  return ((base[0]?.[0] || "?") + (base[1]?.[0] || "")).toUpperCase();
}
function hhmm(d){ return d.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" }); }
function hhmmss(d){ return d.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit", second:"2-digit" }); }
function inicioLegivel(jogo, agora = new Date()){
  const d = new Date(jogo.cfg.inicio);
  const mesmoDia = d.toDateString() === agora.toDateString();
  return mesmoDia ? "Hoje • " + hhmm(d) : d.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit" }) + " • " + hhmm(d);
}
function oddBR(n){ return String(n).replace(".", ","); }

/* Requisição com tempo-limite (para não travar se a rede engasgar) */
async function requisitar(url){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), CONFIG.TIMEOUT_MS);
  try{
    const resp = await fetch(url, { cache:"no-store", signal: ctrl.signal });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    return await resp.json();
  } finally {
    clearTimeout(t);
  }
}

/* =====================================================================
   4) ESTADO DA PÁGINA
   ===================================================================== */
const estado = {
  jogos: [],              // um objeto por jogo (config + dados da API + refs do DOM)
  filtro: "todos",
  busca: "",
  ultimaAtualizacao: null,
  erro: false,
  ocupado: false,
  timer: null,
  proximaEm: 0,
  demoCiclo: 0
};

/* =====================================================================
   5) INTERPRETAÇÃO DO STATUS VINDO DA API
   ---------------------------------------------------------------------
   O TheSportsDB devolve códigos como "NS", "1H", "HT", "2H", "FT", "AET",
   "PEN". Convertemos para os quatro status pedidos (+ adiado/aguardando).
   ===================================================================== */
function interpretarStatus(jogo){
  const s = semAcento(jogo.api.statusTexto);
  const agora = Date.now();
  const inicio = new Date(jogo.cfg.inicio).getTime();
  const temPlacar = jogo.api.casa !== null && jogo.api.fora !== null;

  if (!s){ // API ainda não devolveu nada para este jogo
    if (temPlacar && agora > inicio + 150 * 60 * 1000) return { codigo:"encerrado", rotulo:"Encerrado" };
    return agora < inicio
      ? { codigo:"naoIniciado", rotulo:"Não iniciado" }
      : { codigo:"semDados", rotulo:"Aguardando dados" };
  }

  if (["postponed","pst","adiado","susp","suspended"].includes(s)) return { codigo:"adiado", rotulo:"Adiado" };
  if (["cancelled","canceled","canc","abandoned","abd"].includes(s)) return { codigo:"adiado", rotulo:"Cancelado" };
  if (["ft","aet","pen","ap","finished","match finished","ended","after penalties","after extra time"].includes(s))
    return { codigo:"encerrado", rotulo:"Encerrado" };
  if (["ht","half time","halftime","intervalo","half-time"].includes(s)) return { codigo:"intervalo", rotulo:"Intervalo" };
  if (["1h","2h","et","bt","p","live","inplay","in play","playing","extra time","break"].includes(s))
    return { codigo:"aoVivo", rotulo:"Ao vivo" };
  if (["ns","not started","tbd",""].includes(s)){
    return agora < inicio ? { codigo:"naoIniciado", rotulo:"Não iniciado" } : { codigo:"semDados", rotulo:"Aguardando dados" };
  }
  // Código desconhecido: se já há placar e o jogo começou há muito tempo, tratamos como encerrado.
  if (temPlacar && agora > inicio + 150 * 60 * 1000) return { codigo:"encerrado", rotulo:"Encerrado" };
  return { codigo:"semDados", rotulo:"Aguardando dados" };
}

/* Como está o palpite do bilhete neste jogo */
function situacaoPalpite(jogo, codigoStatus){
  const p = jogo.cfg.palpite;
  if (!p) return null;
  const a = jogo.api.casa, b = jogo.api.fora;

  if (codigoStatus === "naoIniciado" || codigoStatus === "semDados" || codigoStatus === "adiado" || a === null || b === null){
    return { texto: "aguardando", classe: "situacao--neutro" };
  }
  const golsPalpite = p.lado === "casa" ? a : b;
  const golsRival   = p.lado === "casa" ? b : a;

  if (codigoStatus === "encerrado"){
    if (golsPalpite > golsRival) return { texto: "✅ palpite certo", classe: "situacao--ok" };
    if (golsPalpite < golsRival) return { texto: "❌ palpite perdido", classe: "situacao--ruim" };
    return { texto: "❌ empate — palpite perdido", classe: "situacao--ruim" };
  }
  if (golsPalpite > golsRival) return { texto: "▲ na frente", classe: "situacao--ok" };
  if (golsPalpite < golsRival) return { texto: "▼ atrás", classe: "situacao--ruim" };
  return { texto: "● empatado", classe: "situacao--neutro" };
}

/* =====================================================================
   6) CRIAÇÃO E ATUALIZAÇÃO DOS CARDS
   ===================================================================== */
function montarEscudo(container, url, nome){
  // Cria o escudo com imagem; se a imagem falhar, mostra as iniciais num círculo.
  const img = document.createElement("img");
  img.alt = nome;
  img.loading = "lazy";
  img.referrerPolicy = "no-referrer";
  img.onerror = () => {
    img.remove();
    if (!container.querySelector(".iniciais")){
      const span = document.createElement("span");
      span.className = "iniciais";
      span.textContent = iniciais(nome);
      container.appendChild(span);
    }
  };
  img.src = url;
  container.appendChild(img);
}

function criarCard(jogo){
  const el = document.createElement("article");
  el.className = "card";
  el.dataset.id = jogo.cfg.idEvento;

  const timeHTML = (lado) => `
    <div class="time">
      <div class="escudo" data-escudo="${lado}"></div>
      <div class="time__nome" data-nome="${lado}"></div>
    </div>`;

  el.innerHTML = `
    <div class="card__topo">
      <span class="campeonato"></span>
      <span class="chip"><span class="ponto" hidden></span><span class="chip__txt"></span></span>
    </div>
    <div class="confronto">
      ${timeHTML("casa")}
      <div>
        <div class="placar"><b data-gols="casa">–</b><span class="x">x</span><b data-gols="fora">–</b></div>
        <div class="minuto" hidden></div>
      </div>
      ${timeHTML("fora")}
    </div>
    <div class="card__rodape">
      <span class="palpite"></span>
      <span class="inicio"></span>
    </div>`;

  // referências rápidas para atualizar sem redesenhar tudo
  jogo.dom = {
    el,
    campeonato: el.querySelector(".campeonato"),
    chip: el.querySelector(".chip"),
    chipTxt: el.querySelector(".chip__txt"),
    ponto: el.querySelector(".ponto"),
    placar: el.querySelector(".placar"),
    golsCasa: el.querySelector('[data-gols="casa"]'),
    golsFora: el.querySelector('[data-gols="fora"]'),
    minuto: el.querySelector(".minuto"),
    palpite: el.querySelector(".palpite"),
    inicio: el.querySelector(".inicio")
  };

  jogo.dom.campeonato.textContent = jogo.cfg.campeonato;
  jogo.dom.el.querySelector('[data-nome="casa"]').textContent = jogo.cfg.casa.nome;
  jogo.dom.el.querySelector('[data-nome="fora"]').textContent = jogo.cfg.fora.nome;
  montarEscudo(el.querySelector('[data-escudo="casa"]'), jogo.api.escudoCasa, jogo.cfg.casa.nome);
  montarEscudo(el.querySelector('[data-escudo="fora"]'), jogo.api.escudoFora, jogo.cfg.fora.nome);

  return el;
}

/* Descobre o palpite/odd (rodapé do card) */
function montarPalpite(jogo, situacao){
  const p = jogo.cfg.palpite;
  if (!p) { jogo.dom.palpite.innerHTML = ""; return; }
  jogo.dom.palpite.innerHTML =
    `<span class="palpite__tag">Palpite: <b>${p.nome}</b> @${oddBR(p.odd)}</span>` +
    `<span class="situacao ${situacao.classe}">${situacao.texto}</span>`;
}

/* Anima o número do placar quando sai gol (comparando com o valor anterior) */
function animarGol(jogo, lado){
  const el = lado === "casa" ? jogo.dom.golsCasa : jogo.dom.golsFora;
  el.classList.remove("gol");
  void el.offsetWidth;            // reinicia a animação
  el.classList.add("gol");
  jogo.dom.el.classList.remove("card--flash");
  void jogo.dom.el.offsetWidth;
  jogo.dom.el.classList.add("card--flash");
  clearTimeout(jogo._flash1); clearTimeout(jogo._flash2);
  jogo._flash1 = setTimeout(() => el.classList.remove("gol"), 5000);
  jogo._flash2 = setTimeout(() => jogo.dom.el.classList.remove("card--flash"), 5000);
}

function atualizarCard(jogo){
  const status = interpretarStatus(jogo);
  jogo.statusCodigo = status.codigo;
  const estilo = ESTILO_STATUS[status.codigo] || ESTILO_STATUS.semDados;

  /* --- selo de status --- */
  jogo.dom.chip.className = "chip " + estilo.classe;
  const aoVivo = status.codigo === "aoVivo";
  jogo.dom.chipTxt.textContent = status.rotulo + (aoVivo && jogo.api.minuto ? " • " + jogo.api.minuto + "'" : "");
  jogo.dom.ponto.hidden = !aoVivo;

  /* --- placar central --- */
  const temPlacar = jogo.api.casa !== null && jogo.api.fora !== null;
  jogo.dom.el.classList.toggle("card--aovivo", aoVivo);

  if (status.codigo === "naoIniciado" || status.codigo === "adiado"){
    // ainda não começou: mostra o horário de início em destaque
    jogo.dom.placar.className = "placar placar--hora";
    jogo.dom.golsCasa.textContent = hhmm(new Date(jogo.cfg.inicio));
    jogo.dom.golsFora.textContent = "";
    jogo.dom.placar.querySelector(".x").style.display = "none";
  } else if (temPlacar){
    jogo.dom.placar.className = "placar" + (status.codigo === "encerrado" ? " placar--final" : "");
    jogo.dom.placar.querySelector(".x").style.display = "";
    const novos = { casa: jogo.api.casa, fora: jogo.api.fora };
    for (const lado of ["casa","fora"]){
      const alvo = lado === "casa" ? jogo.dom.golsCasa : jogo.dom.golsFora;
      const anterior = jogo.api["anterior_" + lado];
      const novo = novos[lado];
      if (anterior !== null && anterior !== undefined && novo !== null && novo !== anterior && novo > anterior){
        animarGol(jogo, lado);
      }
      alvo.textContent = novo;
      jogo.api["anterior_" + lado] = novo;
    }
  } else {
    jogo.dom.placar.className = "placar placar--hora";
    jogo.dom.golsCasa.textContent = "–";
    jogo.dom.golsFora.textContent = "–";
    jogo.dom.placar.querySelector(".x").style.display = "";
  }

  /* --- minuto (jogo ao vivo) --- */
  const mostrarMinuto = (aoVivo || status.codigo === "intervalo") && jogo.api.minuto;
  jogo.dom.minuto.hidden = !mostrarMinuto;
  if (mostrarMinuto){
    jogo.dom.minuto.textContent = status.codigo === "intervalo" ? "no intervalo" : jogo.api.minuto + "'";
  }

  /* --- rodapé: palpite + horário de início --- */
  montarPalpite(jogo, situacaoPalpite(jogo, status.codigo) || { texto:"", classe:"" });
  jogo.dom.inicio.textContent = "Início: " + inicioLegivel(jogo);
}

/* =====================================================================
   7) ORDENAÇÃO, FILTROS E BUSCA
   ===================================================================== */
function visivel(jogo){
  if (!FILTROS[estado.filtro](jogo.statusCodigo || "semDados")) return false;
  if (!estado.busca) return true;
  const alvo = semAcento([jogo.cfg.casa.nome, jogo.cfg.fora.nome, jogo.cfg.campeonato].join(" "));
  return alvo.includes(semAcento(estado.busca));
}

function renderizar(){
  // 1) atualiza cada card
  estado.jogos.forEach(atualizarCard);

  // 2) ordena: ao vivo primeiro, depois por status e horário de início
  const ordenados = [...estado.jogos].sort((a, b) => {
    const pa = ORDEM_STATUS[a.statusCodigo] ?? 9;
    const pb = ORDEM_STATUS[b.statusCodigo] ?? 9;
    if (pa !== pb) return pa - pb;
    return new Date(a.cfg.inicio) - new Date(b.cfg.inicio);
  });

  // 3) mostra/esconde conforme filtro e busca (reaproveita os mesmos nós,
  //    assim as animações em andamento não são interrompidas)
  const container = $("#cards");
  ordenados.forEach(jogo => {
    jogo.dom.el.style.display = visivel(jogo) ? "" : "none";
    container.appendChild(jogo.dom.el);
  });

  atualizarResumo();
}

/* Contadores do topo + cota total do bilhete */
function atualizarResumo(){
  const contar = (fn) => estado.jogos.filter(j => fn(j.statusCodigo)).length;
  const aoVivo = contar(c => c === "aoVivo" || c === "intervalo");
  const encerrados = contar(c => c === "encerrado");
  const proximos = contar(c => c === "naoIniciado" || c === "semDados" || c === "adiado");
  const cota = CONFIG.JOGOS.reduce((t, j) => t * (j.palpite ? j.palpite.odd : 1), 1);
  const retorno = cota * CONFIG.VALOR_APOSTA;

  $("#resumo").innerHTML = [
    `<span class="resumo__item">⚽ <b>${estado.jogos.length}</b> jogos</span>`,
    `<span class="resumo__item">🔴 <b>${aoVivo}</b> ao vivo</span>`,
    `<span class="resumo__item">✅ <b>${encerrados}</b> encerrados</span>`,
    `<span class="resumo__item">🕒 <b>${proximos}</b> a começar</span>`,
    `<span class="resumo__item">Cota total <b>${oddBR(cota.toFixed(2))}</b></span>`,
    `<span class="resumo__item">R$ ${oddBR(CONFIG.VALOR_APOSTA.toFixed(2))} → <b>R$ ${oddBR(retorno.toFixed(2))}</b></span>`
  ].join("");
}

/* =====================================================================
   8) BUSCA DE DADOS NA API
   ---------------------------------------------------------------------
   A cada ciclo fazemos:
     • 1 chamada ao livescore (dá o minuto atual dos jogos ao vivo);
     • 1 chamada por jogo (placar, status e escudos — a fonte principal).
   São ~8 requisições a cada 30s (≈16/min), dentro do limite da chave free.
   ===================================================================== */
function aplicarEvento(jogo, ev){
  if (!ev) return false;
  jogo.api.statusTexto = ev.strStatus || jogo.api.statusTexto || "";
  const converter = (v) => (v === null || v === undefined || v === "" ? null : Number(v));
  const nc = converter(ev.intHomeScore), nf = converter(ev.intAwayScore);
  if (nc !== null) jogo.api.casa = nc;
  if (nf !== null) jogo.api.fora = nf;
  if (ev.strHomeTeamBadge) jogo.api.escudoCasa = ev.strHomeTeamBadge;
  if (ev.strAwayTeamBadge) jogo.api.escudoFora = ev.strAwayTeamBadge;
  return true;
}

async function atualizarDados(){
  if (estado.ocupado) return;
  estado.ocupado = true;
  $("#btnAtualizar").disabled = true;

  try{
    if (CONFIG.MODO_DEMO){ aplicarDemo(); return; }

    const base = `${CONFIG.URL_BASE}/${CONFIG.API_KEY}`;
    const pedidos = [
      requisitar(`${base}/livescore.php?s=Soccer`),
      ...estado.jogos.map(j => requisitar(`${base}/lookupevent.php?id=${j.cfg.idEvento}`))
    ];
    const respostas = await Promise.allSettled(pedidos);

    let sucessos = 0;

    // (a) mapa dos jogos ao vivo (usado para o minuto)
    const aoVivoPorId = {};
    const ls = respostas[0];
    if (ls.status === "fulfilled" && ls.value){
      (ls.value.livescore || []).forEach(e => { aoVivoPorId[e.idEvent] = e; });
    }

    // (b) dados de cada jogo do bilhete
    estado.jogos.forEach((jogo, i) => {
      const r = respostas[i + 1];
      let ok = false;

      if (r.status === "fulfilled" && r.value?.events?.[0]){
        ok = aplicarEvento(jogo, r.value.events[0]) || ok;
      }
      const live = aoVivoPorId[jogo.cfg.idEvento];
      if (live){
        // o livescore é ótimo para o minuto; também serve de reserva se a
        // chamada individual falhou
        jogo.api.minuto = live.strProgress || "";
        if (!ok){
          ok = aplicarEvento(jogo, {
            strStatus: live.strStatus,
            intHomeScore: live.intHomeScore,
            intAwayScore: live.intAwayScore,
            strHomeTeamBadge: live.strHomeTeamBadge,
            strAwayTeamBadge: live.strAwayTeamBadge
          });
        }
      } else if (!["aoVivo","intervalo"].includes(jogo.statusCodigo)){
        jogo.api.minuto = "";
      }
      if (ok) sucessos++;
    });

    if (sucessos === 0) throw new Error("Nenhum jogo retornou dados");

    // conexão ok
    estado.erro = false;
    estado.ultimaAtualizacao = new Date();
    esconderAviso();
    agendar(CONFIG.INTERVALO_SEGUNDOS);

  } catch (e){
    // falhou: mantém o último placar na tela, avisa o usuário e tenta de novo
    estado.erro = true;
    mostrarAviso("⚠️ Sem conexão com a API agora. Os últimos placares continuam na tela e vamos tentar de novo automaticamente…");
    agendar(CONFIG.INTERVALO_RETRY_SEGUNDOS);
  } finally {
    estado.ocupado = false;
    $("#btnAtualizar").disabled = false;
    atualizarRodape();
    renderizar();
  }
}

function agendar(segundos){
  clearTimeout(estado.timer);
  estado.proximaEm = Date.now() + segundos * 1000;
  estado.timer = setTimeout(atualizarDados, segundos * 1000);
}

function atualizarRodape(){
  const saude = $("#saude");
  saude.className = "saude " + (estado.erro ? "saude--erro" : (estado.ultimaAtualizacao ? "saude--ok" : ""));
  saude.title = estado.erro ? "Falha na conexão com a API" : "Conectado à API";
  $("#ultimaAtualizacao").textContent = estado.ultimaAtualizacao
    ? "Última atualização: " + hhmmss(estado.ultimaAtualizacao) + (estado.erro ? " (tentando reconectar…)" : "")
    : "Aguardando a primeira atualização…";
}

function mostrarAviso(txt){ const a = $("#aviso"); a.textContent = txt; a.hidden = false; }
function esconderAviso(){ $("#aviso").hidden = true; }

/* =====================================================================
   9) MODO DEMO (opcional) — dados falsos, só para testar o layout
   ---------------------------------------------------------------------
   Nada aqui é placar real. Só roda se CONFIG.MODO_DEMO = true.
   ===================================================================== */
const DADOS_DEMO = [
  { id:"2442795", casa:0, fora:1, status:"2H", minuto:63 },
  { id:"2442790", casa:1, fora:0, status:"HT", minuto:"" },
  { id:"2442792", casa:2, fora:0, status:"2H", minuto:71 },
  { id:"2442793", casa:0, fora:0, status:"1H", minuto:22 },
  { id:"2442788", casa:1, fora:1, status:"2H", minuto:80 },
  { id:"2442789", casa:1, fora:0, status:"NS", minuto:"" },
  { id:"2475296", casa:1, fora:2, status:"FT", minuto:"" }
];

function aplicarDemo(){
  $("#demoBadge").hidden = false;
  estado.demoCiclo++;
  const ciclo = estado.demoCiclo;

  estado.jogos.forEach(jogo => {
    const d = DADOS_DEMO.find(x => x.id === jogo.cfg.idEvento);
    if (!d) return;
    jogo.api.casa = d.casa;
    jogo.api.fora = d.fora;
    jogo.api.statusTexto = d.status;
    jogo.api.minuto = d.minuto ? String(Math.min(90, Number(d.minuto) + (ciclo - 1) * 1)) : "";
  });

  // de vez em quando "sai um gol" só para mostrar a animação
  if (ciclo % 4 === 0){
    const vivo = estado.jogos.filter(j => ["1H","2H"].includes(j.api.statusTexto));
    if (vivo.length){
      const j = vivo[Math.floor(Math.random() * vivo.length)];
      if (Math.random() < 0.5) j.api.casa++; else j.api.fora++;
    }
  }
  estado.erro = false;
  estado.ultimaAtualizacao = new Date();
  agendar(CONFIG.INTERVALO_SEGUNDOS);
}

/* =====================================================================
   10) INICIALIZAÇÃO
   ===================================================================== */
function iniciar(){
  $("#rodapeIntervalo").textContent = CONFIG.INTERVALO_SEGUNDOS;

  // monta os 7 objetos de jogo a partir da configuração
  estado.jogos = CONFIG.JOGOS.map(cfg => ({
    cfg,
    api: {
      statusTexto: "", minuto: "",
      casa: null, fora: null, anterior_casa: null, anterior_fora: null,
      escudoCasa: cfg.casa.escudo, escudoFora: cfg.fora.escudo
    },
    dom: null,
    statusCodigo: "semDados"
  }));

  const container = $("#cards");
  estado.jogos.forEach(jogo => container.appendChild(criarCard(jogo)));
  renderizar();
  atualizarRodape();

  /* --- eventos de interface --- */
  document.querySelectorAll(".filtro").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filtro").forEach(b => b.classList.remove("ativo"));
      btn.classList.add("ativo");
      estado.filtro = btn.dataset.filtro;
      renderizar();
    });
  });
  $("#busca").addEventListener("input", (e) => {
    estado.busca = e.target.value;
    renderizar();
  });
  $("#btnAtualizar").addEventListener("click", atualizarDados);
  document.addEventListener("visibilitychange", () => {
    // ao voltar para a aba, atualiza na hora se já passou do horário previsto
    if (!document.hidden && Date.now() > estado.proximaEm - 1000) atualizarDados();
  });

  // contagem regressiva até a próxima atualização
  setInterval(() => {
    const el = $("#proxima");
    if (!estado.proximaEm) { el.textContent = ""; return; }
    const s = Math.max(0, Math.round((estado.proximaEm - Date.now()) / 1000));
    el.textContent = "• próxima em " + s + "s";
  }, 1000);

  // primeira carga
  atualizarDados();
}

document.addEventListener("DOMContentLoaded", iniciar);

/* =====================================================================
   NOTAS SOBRE A API (leia se for trocar de provedor)
   ---------------------------------------------------------------------
   1. TheSportsDB (usada aqui): funciona no navegador sem proxy, porque o
      servidor manda "Access-Control-Allow-Origin: *" (CORS liberado) e a
      chave "3" é pública de teste. Limite da chave gratuita: ~30
      requisições/minuto — nossa página usa ~16/min.
   2. Trocar de jogo: pegue o ID em
      https://www.thesportsdb.com/api/v1/json/3/searchevents.php?e=TimeA_vs_TimeB
      e cole em "idEvento" no bloco CONFIG.JOGOS.
   3. API-Football (api-sports.io): exige chave no cabeçalho "x-apisports-key"
      e o plano grátis só dá 100 requisições/dia — não serve para atualizar
      a cada 30s. Também costuma exigir proxy por causa do CORS.
   4. Football-Data.org: exige token (X-Auth-Token) e o plano gratuito não
      cobre a Liga das Nações. Se usar, precisa de um servidor intermediário
      (proxy) por causa do CORS e da chave exposta no navegador.
   ===================================================================== */
